[[permission]]
identifier = "inspect-runtime"
description = "Read application and local database health from the main window."
commands.allow = ["runtime_info"]

[[permission]]
identifier = "manage-records"
description = "Create, read and save local text records and tags."
commands.allow = ["record_create", "record_read", "record_list", "trash_status", "trash_impact", "trash_move", "trash_list", "trash_restore", "trash_purge", "library_query", "library_preview", "record_save", "tag_create", "record_export", "record_exit", "recovery_list", "recovery_read", "record_begin_edit", "record_end_edit", "history_list", "history_read", "history_mark", "history_restore", "attachment_import", "attachment_image", "attachment_copy"]
