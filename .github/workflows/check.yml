name: Checks
run-name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Metadata verification' || format('Validation {0}@{1}', github.base_ref || github.ref_name, github.event.pull_request.base.sha || github.sha) }}
on:
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  # Metadata edits must neither cancel validation nor replace its required check.
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'validation' }}
  cancel-in-progress: true
jobs:
  policy:
    name: Policy and change scope
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.scope.outputs.common }}
      rust: ${{ steps.scope.outputs.rust }}
      desktop: ${{ steps.scope.outputs.desktop }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify routing and select checks
        id: scope
        run: node scripts/ci/policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate || false }}
      - name: Verify policy boundaries
        run: node --test scripts/ci/policy.node.mjs
  common:
    name: Common checks
    needs: policy
    if: needs.policy.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:architecture
      - run: npm run test:architecture
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:ui
  rust:
    name: Rust checks (macOS)
    needs: policy
    if: needs.policy.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: 'false'
          cache-bin: 'false'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --tests
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: policy
    if: needs.policy.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: 'false'
          cache-bin: 'false'
      - run: npm ci --no-audit --no-fund
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run test:rust
      - run: npm run check:rust
      - name: Compile desktop
        if: inputs.candidate != true
        run: npm run desktop:ci
      - name: Build isolated preview installer
        if: inputs.candidate == true
        run: node scripts/ci/candidate.mjs
      - name: Upload candidate and provenance
        if: inputs.candidate == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            .ci/candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  images:
    name: Image validation (${{ matrix.os }})
    needs: policy
    if: needs.policy.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.policy.outputs.desktop == 'true' && '["macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo fmt --manifest-path tools/image-validation/Cargo.toml --check
      - run: cargo test --locked --manifest-path tools/image-validation/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/image-validation/Cargo.toml --all-targets -- -D warnings
  gate:
    name: CI Gate
    if: always()
    timeout-minutes: 70
    needs: [policy, common, rust, desktop, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify required job results
        if: github.event.action != 'edited' || github.event.changes.base
        run: node scripts/ci/gate.mjs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
      - name: Verify existing validation for metadata edit
        if: github.event.action == 'edited' && !github.event.changes.base
        run: node scripts/ci/metadata.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
