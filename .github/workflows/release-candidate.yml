name: Release candidate
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    uses: ./.github/workflows/check.yml
    with:
      candidate: true
