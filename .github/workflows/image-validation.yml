name: Image capability validation
on:
  push:
    paths:
      - 'tools/image-validation/**'
      - '.github/workflows/image-validation.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decode:
    name: Image decoding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path tools/image-validation/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/image-validation/Cargo.toml --all-targets -- -D warnings
